[package]
name = "desktop-meter"
version = "0.2.2"
edition = "2024"
description = "纯 Rust Windows 桌面资源监视器"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "=0.18.1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
semver = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt", "time"] }
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Wdk_Graphics_Direct3D", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery"] }
windows-sys = { version = "=0.60.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_System_Power", "Win32_System_Time", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Controls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "1"

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

