[package]
name = "desktop-meter"
version = "0.1.0"
edition = "2024"
description = "纯 Rust Windows 桌面资源监视器"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Wdk_Graphics_Direct3D"] }
windows-sys = { version = "=0.60.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Controls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "1"

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

